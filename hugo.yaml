title: "Gehara Lab"
baseURL: "https://marcelogehara.org"
theme: "hugo-researcher"
disableKinds: ["taxonomy", "term"]
enableEmoji: true
math: false

outputs:
  home:
    - "HTML"
    - "RSS"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

markup:
  goldmark:
    renderer:
      unsafe: true

permalinks:
  /: "/:contentbasename"

params:
  author: "Gehara Lab"
  description: "Evolution and Biodiversity"
  favicon: "favicon.ico"
  footer:
    text: "Gehara Lab — Rutgers University-Newark"
    url: "https://github.com/gehara"
  style:
    fontFamily: "Inconsolata"
    fontSize: "14pt"
    pageWidth: "750px"
    avatarSize: "120px"
    colorBlack: "#222222"
    colorRed: "#dc3545"
  socialIcons:
    - icon: "fab fa-github"
      title: "GitHub"
      url: "https://github.com/gehara"
    - icon: "fas fa-envelope"
      title: "E-mail"
      url: "mailto:m.gehara@rutgers.edu"
    - icon: "ai ai-google-scholar"
      title: "Google Scholar"
      url: "https://scholar.google.com/citations?hl=en&user=lYIUAmYAAAAJ"

menu:
  main:
    - name: "Home"
      url: "/"
      weight: 1
    - name: "Research"
      url: "/research"
      weight: 2
    - name: "People"
      url: "/people"
      weight: 3
    - name: "Publications"
      url: "/publications"
      weight: 4
    - name: "Teaching"
      url: "/teaching"
      weight: 5
    - name: "Software"
      url: "/software"
      weight: 6
    - name: "Photos"
      url: "/photos"
      weight: 7
    - name: "Join Us"
      url: "/join"
      weight: 8
    - name: "Music"
      url: "/music"
      weight: 9
